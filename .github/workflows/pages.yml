# Publishes site/ to GitHub Pages on every push to the default branch.
#
# Deliberately dumb: it uploads what was committed and nothing else. The wiki
# is GENERATED, and the freshness check for it lives in tools/check_wiki.py,
# which deploy.py runs before shipping. It has to: the icons are read out of
# the Minecraft jar in the local Loom cache, so the page can only be built on
# a machine that has built the mod. A runner cannot do it and should not try.
name: wiki

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
